name: test

# OPT-IN MODE: the only file a repository needs to run its pytest suite.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    # Same ref rule as lint.yml: the same full commit SHA.
    uses: AGENTIC-AI-PDLC-PLATFORM/ci-reusable-workflows-and-composite-actions-repo/.github/workflows/python-test.yml@REPLACE_WITH_FULL_SHA_OF_MAIN
    with:
      requirements: requirements.txt   # optional, one file per line
      # packages: -e .[test]           # optional, extra pip arguments
      # path: tests                    # optional, defaults to pytest's own discovery
