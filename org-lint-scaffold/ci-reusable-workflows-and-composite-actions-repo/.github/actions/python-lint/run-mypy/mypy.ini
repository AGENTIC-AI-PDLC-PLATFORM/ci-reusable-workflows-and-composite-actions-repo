# Org-wide Python type-check policy. Versioned together with typecheck.py and action.yml:
# a rule change ships in the same commit as the code; repos pinned to a SHA move deliberately.
# How each part of that sentence is enforced: ENFORCEMENT.md at the repository root.
# mypy has no required-version setting: tests/test_lint_policy.py checks that the mypy that runs
# is the pin in requirements.txt, and that the findings on its fixture match the expected list.
[mypy]
# Same exclusions as the lint policy (ruff.toml), as a regex on discovered paths.
exclude = (^|/)(\.venv|build|dist|migrations)/
# Packages without type information count as Any instead of failing the check.
# Pass `mypy-requirements` so installed, typed packages are still checked.
ignore_missing_imports = True
# mypy defaults + the bodies of unannotated functions are type-checked too.
check_untyped_defs = True
