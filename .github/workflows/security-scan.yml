name: org-security-scan

# REUSABLE WORKFLOW: static security analysis of the calling repository's code
# (bandit) and known-vulnerability audit of its dependencies (pip-audit).
# Setup comes from the shared composite actions of this repository (common/).

on:
  workflow_call:
    inputs:
      path:
        description: Directory or file to scan with bandit, relative to the repository root.
        type: string
        default: "."
      requirements:
        description: Requirement files to audit with pip-audit, one per line. Empty = no dependency audit.
        type: string
        default: ""
      severity:
        description: "Lowest bandit severity reported: low, medium or high."
        type: string
        default: medium
      confidence:
        description: "Lowest bandit confidence reported: low, medium or high."
        type: string
        default: medium
      mode:
        description: "'enforce' fails the job on findings; 'report' only annotates."
        type: string
        default: enforce
      python-version:
        description: Python used to run the scanners.
        type: string
        default: "3.12"
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

# A called workflow can only keep or reduce the caller's permissions.
permissions:
  contents: read

jobs:
  scan:
    name: security-scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      # In a called workflow the github context is the CALLER's,
      # so this checks out the repository being scanned, not this one.
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # $/ = THIS repository at the exact commit the caller selected: no checkout,
      # no ref to keep in step.
      - name: Set up Python for the scanners
        id: py
        uses: $/.github/actions/common/install-python
        with:
          python-version: ${{ inputs.python-version }}

      # Pinned: a scanner upgrade is a deliberate commit to this repository.
      - name: Install pinned scanners
        id: venv
        uses: $/.github/actions/common/install-dependencies
        with:
          python-path: ${{ steps.py.outputs.python-path }}
          venv: org-security-scan
          packages: bandit==1.9.4 pip-audit==2.10.1

      # Inputs go through env, never inline ${{ }} in the script (prevents script injection).
      - name: Scan code (bandit)
        shell: bash
        env:
          SCAN_PY: ${{ steps.venv.outputs.python }}
          SCAN_PATH: ${{ inputs.path }}
          SCAN_SEVERITY: ${{ inputs.severity }}
          SCAN_CONFIDENCE: ${{ inputs.confidence }}
          SCAN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          esc() { local v=$1; v=${v//'%'/%25}; v=${v//$'\r'/%0D}; v=${v//$'\n'/%0A}; printf '%s' "$v"; }
          case "$SCAN_MODE" in
            enforce) level=error ;;
            report) level=warning ;;
            *) echo "::error title=org-security-scan::invalid mode: $(esc "$SCAN_MODE")"; exit 2 ;;
          esac
          # bandit exits 0 on a missing path: checked here so a typo cannot pass silently.
          if [ ! -e "$SCAN_PATH" ]; then
            echo "::error title=org-security-scan::path not found: $(esc "$SCAN_PATH")"
            exit 2
          fi
          out="$RUNNER_TEMP/bandit.txt"
          status=0
          # One annotation per finding; same exclusions as the org lint policy.
          "$SCAN_PY" -m bandit -r "$SCAN_PATH" -q \
            -x "/.venv/,/build/,/dist/,/migrations/" \
            --severity-level "$SCAN_SEVERITY" --confidence-level "$SCAN_CONFIDENCE" \
            -f custom --msg-template "::$level file={relpath},line={line},title=bandit {test_id} ({severity})::{msg}" \
            > "$out" || status=$?
          cat "$out"
          count="$(grep -c '^::' "$out" || true)"
          {
            echo "### Code scan (bandit)"
            echo ""
            echo "Target \`$SCAN_PATH\` · severity ≥ \`$SCAN_SEVERITY\` · confidence ≥ \`$SCAN_CONFIDENCE\` · **$count finding(s)**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$count" -eq 0 ]; then
            echo "::error title=org-security-scan::bandit could not run (exit $status)"
            exit 2
          fi
          if [ "$count" -gt 0 ] && [ "$SCAN_MODE" = "enforce" ]; then exit 1; fi

      # Runs even when bandit failed, so one push shows both kinds of findings.
      - name: Audit dependencies (pip-audit)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' && inputs.requirements != '' }}
        shell: bash
        env:
          SCAN_PY: ${{ steps.venv.outputs.python }}
          SCAN_REQUIREMENTS: ${{ inputs.requirements }}
          SCAN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pip-audit.md"
          args=(--progress-spinner off --desc off -f markdown -o "$report")
          while IFS=$' \t' read -r req; do
            [ -n "$req" ] || continue
            args+=(-r "$req")
          done <<< "$SCAN_REQUIREMENTS"
          status=0
          "$SCAN_PY" -m pip_audit "${args[@]}" || status=$?
          {
            echo "### Dependency audit (pip-audit)"
            echo ""
            if [ -s "$report" ]; then cat "$report"; elif [ "$status" -eq 0 ]; then echo "No known vulnerabilities found."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # pip-audit exits 1 both for vulnerabilities and for its own errors (see the log).
          if [ "$status" -ne 0 ] && [ "$SCAN_MODE" = "report" ]; then
            echo "::warning title=org-security-scan::pip-audit exited $status (report mode: not failing the job)"
            exit 0
          fi
          exit "$status"
