name: Org code scan (bandit)
description: >-
  Runs bandit, a static security scanner for Python code, at the organization's thresholds.
  The implementation (scan.py) and the hash-locked bandit (requirements.txt) ship inside
  this action, and every $/ reference resolves to the same commit, so they are always
  versioned together.

inputs:
  path:
    description: Directory or file to scan, relative to the workspace.
    required: false
    default: "."
  python-version:
    description: Python used to run bandit. It must be able to parse the code it scans.
    required: false
    default: "3.12"
  mode:
    description: "'enforce' fails the step on findings; 'report' only annotates (phased rollout)."
    required: false
    default: enforce
  severity:
    description: "Lowest severity reported: low, medium or high."
    required: false
    default: medium
  confidence:
    description: "Lowest confidence reported: low, medium or high."
    required: false
    default: medium

outputs:
  issues:
    description: Number of findings.
    value: ${{ steps.scan.outputs.issues }}

runs:
  using: composite
  steps:
    # $/ = this repository at the exact commit being run: no ref to keep in step.
    # update-environment: false -> the caller job's PATH/python are left untouched.
    - name: Set up Python for bandit
      id: py
      uses: $/.github/actions/common/install-python
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: "false"

    # Private venv -> bandit's dependencies never clash with another scanner's or the project's.
    # locked-requirements -> pip --require-hashes: only files hashed in requirements.txt install.
    - name: Install the pinned bandit
      id: venv
      uses: $/.github/actions/common/install-dependencies
      with:
        python-path: ${{ steps.py.outputs.python-path }}
        venv: org-security-scan-bandit
        locked-requirements: ${{ github.action_path }}/requirements.txt

    # Inputs go through env, never inline ${{ }} in the script (prevents script injection).
    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PY: ${{ steps.venv.outputs.python }}
        SCAN_PATH: ${{ inputs.path }}
        SCAN_MODE: ${{ inputs.mode }}
        SCAN_SEVERITY: ${{ inputs.severity }}
        SCAN_CONFIDENCE: ${{ inputs.confidence }}
      run: |
        set -euo pipefail
        "$SCAN_PY" "$GITHUB_ACTION_PATH/scan.py" \
          --path "$SCAN_PATH" \
          --mode "$SCAN_MODE" \
          --severity "$SCAN_SEVERITY" \
          --confidence "$SCAN_CONFIDENCE"
